<html>
</head>
<body>
	 <div id="h5p-container"></div>
	
	<script type="text/javascript" src="h5p-player/main.bundle.js" charset="UTF-8"></script>
	
	<script>
	 document.addEventListener('DOMContentLoaded', function () {
  const el = document.getElementById('h5p-container');
  const options = {
    h5pJsonPath: 'leonardoVR', // Path to the extracted H5P content
    frameJs: 'h5p-player/frame.bundle.js', // Path to player's frame.bundle.js
    frameCss: 'h5p-player/styles/h5p.css', // Path to player's h5p.css
  };
  new H5PStandalone.H5P(el, options);
});
	</script>

</body>
</html>
