<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonardo 360 de GmedranoTIC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
        }
        /* Contenedor responsivo para el Tour 360 */
        #tour-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- El tour ocupará toda la pantalla para una mejor experiencia inmersiva -->
    <div id="tour-container"></div>

    <!-- Script de H5P Standalone v3 -->
    <script src="./h5p-player/main.bundle.js"></script>
    <script>
         window.addEventListener('load', async function () {
            const el = document.getElementById('tour-container');
            
            // Detectamos cómo expone el objeto la librería
            const H5PConstructor = window.H5PStandalone ? window.H5PStandalone.H5P : window.H5P;

            if (!H5PConstructor) {
                console.error("No se encontró el constructor de H5P. Revisa que ./h5p-player/main.bundle.js exista.");
                return;
            }
            const options = {
                id: 'tour-360-interactive',
                // Ruta a la carpeta que contiene el h5p.json
                h5pJsonPath: './leonardoVR',
                // Ruta global interna para las librerías necesarias del tour
                librariesPath: './leonardoVR/libraries', 
                frameClickReceived: false
                frameJs: './h5p-player/frame.bundle.js',
                frameCss: './h5p-player/h5p.css'
            };

            try {
                // Inicialización con la sintaxis de la versión v3
                await new H5PStandalone.H5P(el, options);
                console.log('Tour 360 cargado correctamente.');
            } catch (error) {
                console.error('Error al cargar el Tour 360:', error);
            }
        });
    </script>
</body>
</html>
